<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>probe</title>
    <style>
      html,body{margin:0;background:#222}
      iframe{width:390px;height:844px;border:0;background:#fff;display:block;margin:0 auto}
    </style>
  </head>
  <body>
    <iframe id="f" src="/_sheet.html"></iframe>
    <pre id="out" style="display:none"></pre>
    <script>
      var f = document.getElementById("f"), out = document.getElementById("out"), t = 0;
      var timer = setInterval(function () {
        t++;
        try {
          var d = f.contentDocument;
          if (!d) return;
          var r = d.getElementById("probe-report");
          if (!r || !r.textContent) { if (t > 70) { clearInterval(timer); out.textContent = "TIMEOUT"; } return; }
          out.textContent = r.textContent;
          clearInterval(timer);
        } catch (e) { out.textContent = "ERR " + e; clearInterval(timer); }
      }, 400);
    </script>
  </body>
</html>
